<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스노우 엔젤</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e6edf7; }
  body { cursor: none; }
  #c { display: block; width: 100vw; height: 100vh; }
  video { display: none; }
  #people-ui { position: fixed; inset: auto clamp(16px, 3vw, 52px) clamp(16px, 3vh, 40px); display: flex; justify-content: space-between; pointer-events: none; }
  .person-card { width: clamp(210px, 14vw, 280px); color: #203c59; font: 600 clamp(16px, 1.1vw, 22px) / 1.35 "Pretendard", "Malgun Gothic", sans-serif; opacity: 0.82; transition: opacity 0.25s; }
  .person-card[data-active="true"] { opacity: 1; }
  .person-head, .person-meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .person-head { margin: 0 2px 9px; font-weight: 700; text-shadow: 0 1px 6px rgba(255,255,255,0.9); }
  .person-head span:last-child { color: #6684a5; font-size: 0.72em; font-weight: 600; letter-spacing: 0.12em; }
  .person-preview { display: block; box-sizing: border-box; width: 100%; aspect-ratio: 4 / 5; border: 2px solid rgba(255,255,255,0.9); border-radius: 14px; background: url('./assets/snow-angel-mark.png') center / min(190px, 90%) auto no-repeat, radial-gradient(120% 80% at 50% 100%, #ffffff, #dfe8f4 60%, #c8d6ea); box-shadow: 0 12px 30px rgba(48,77,115,0.18); }
  .person-card[data-active="true"] .person-preview { background: #dfe8f4; }
  .person-card[data-active="true"] .person-preview { border-color: #e9f5fc; box-shadow: 0 12px 30px rgba(48,77,115,0.2), 0 0 0 3px rgba(106,151,187,0.42); }
  .person-meta { margin: 10px 2px 7px; font-size: 0.9em; color: #294064; text-shadow: 0 1px 6px rgba(255,255,255,0.9); }
  .person-percent:empty { display: none; }
  .person-progress { height: 3px; margin: 0 2px; overflow: hidden; border-radius: 3px; background: rgba(44,79,115,0.2); }
  .person-progress span { display: block; height: 100%; width: 0; background: #6c9dc2; transition: width 0.2s; }
  @media (max-width: 800px) { .person-card { width: clamp(120px, 22vw, 170px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted></video>
<div id="people-ui" aria-label="참가자 인식 미리보기">
  <aside class="person-card" id="person-left" data-active="false" aria-label="왼쪽 참가자">
    <div class="person-head"><span>← 왼쪽 자리</span><span>01</span></div>
    <canvas class="person-preview" width="240" height="300"></canvas>
    <div class="person-meta"><span class="person-status">자리에 서 주세요</span><span class="person-percent"></span></div>
    <div class="person-progress"><span></span></div>
  </aside>
  <aside class="person-card" id="person-right" data-active="false" aria-label="오른쪽 참가자">
    <div class="person-head"><span>오른쪽 자리 →</span><span>02</span></div>
    <canvas class="person-preview" width="240" height="300"></canvas>
    <div class="person-meta"><span class="person-status">자리에 서 주세요</span><span class="person-percent"></span></div>
    <div class="person-progress"><span></span></div>
  </aside>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver } from './vendor/tasks-vision/vision_bundle.mjs';

/* ───────── 설정 ───────── */
const CFG = {
  drawMin: 8,       // 빠르게 완성해도 이만큼은 몸짓을 즐기게 한다
  drawMax: 20,      // 몸짓 단계 최대 길이(초)
  rise: 4.5,        // 비상 단계
  cover: 3.5,       // 덮임 단계
  enterHold: 0.6,   // 이 시간 이상 서 있으면 시작
  idleCooldown: 1.5,// 순환 후 다시 시작하기까지 대기
  absentLimit: 2.5, // 사람이 사라지면 이 시간 후 마무리
  doneHold: 0.35,   // 완성도 도달 후 비상까지
  completeProgress: 0.7,
  slotHold: 1.8,    // 잠깐 가려져도 기존 참가자 자리를 유지
  minTorsoFrac: 0.11, minShoulderFrac: 0.06, // 먼 배경의 작은 사람 제외
  figure: 0.17,     // 화면 높이 대비 몸통 길이
};
const FONT = '"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const IMP = 0.4; // 자국 캔버스 해상도 비율(부드러운 가장자리 + 성능) — 노트북용으로 낮춤

/* ───────── 캔버스 ───────── */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const video = document.getElementById('v');
const personCards = ['person-left', 'person-right'].map(id => {
  const el = document.getElementById(id), canvas = el.querySelector('canvas');
  return { el, canvas, ctx: canvas.getContext('2d'), status: el.querySelector('.person-status'), percent: el.querySelector('.person-percent'), bar: el.querySelector('.person-progress span') };
});
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const dent = mk(1, 1), shade = mk(1, 1), tmpA = mk(1, 1); // 눌린 모양 마스크 / 합성된 자국 / 작업용
let W = 0, H = 0, DPR = 1, bg = null, glints = [], flakes = [];

function resize() {
  DPR = 1; // 노트북 성능용: 고해상도 화면에서도 1배로 그림(TV 1080p에서는 차이 없음)
  W = cv.width = Math.round(innerWidth * DPR);
  H = cv.height = Math.round(innerHeight * DPR);
  for (const c of [dent, shade, tmpA]) { c.width = Math.round(W * IMP); c.height = Math.round(H * IMP); }
  buildBackground();
  buildSnow();
}
addEventListener('resize', resize);

// 값 노이즈(fBm): 바람에 쓸린 눈더미 결을 만든다
function makeNoise(seed) {
  const N = 256, perm = new Uint8Array(N * 2), val = new Float32Array(N);
  let s = seed >>> 0 || 1;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < N; i++) { perm[i] = i; val[i] = rnd(); }
  for (let i = N - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [perm[i], perm[j]] = [perm[j], perm[i]]; }
  for (let i = 0; i < N; i++) perm[N + i] = perm[i];
  const at = (x, y) => val[perm[(perm[x & 255] + y) & 255]];
  const sm = t => t * t * (3 - 2 * t);
  const n2 = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), u = sm(x - xi), v = sm(y - yi);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  return (x, y, oct = 5) => { let sum = 0, amp = 0.5, f = 1, norm = 0; for (let o = 0; o < oct; o++) { sum += n2(x * f, y * f) * amp; norm += amp; amp *= 0.5; f *= 2.03; } return sum / norm; };
}

function buildBackground() {
  bg = mk(W, H);
  const g = bg.getContext('2d');
  // 1) 바탕: 위(먼 곳)는 푸른 그늘, 아래(가까운 곳)는 밝은 흰 눈 — 바닥처럼 보이게
  const lg = g.createLinearGradient(0, 0, 0, H);
  lg.addColorStop(0, '#d3deee'); lg.addColorStop(0.35, '#e9f0f9'); lg.addColorStop(1, '#f7fafe');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);

  // 2) 눈더미 결: 높이장 → 왼쪽 위 빛으로 음영 (가로로 길게 늘여 바람결 느낌)
  const fbm = makeNoise(7), sw = Math.ceil(W / 6), sh = Math.ceil(H / 6);
  const hgt = new Float32Array(sw * sh);
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const nx = x / sw * 4.2, ny = y / sh * 7.5;
    const warp = fbm(nx * 0.6 + 11, ny * 0.6, 3) * 2.2; // 결을 살짝 휘게
    hgt[y * sw + x] = fbm(nx + warp, ny * 1.0 + warp * 0.4);
  }
  const drift = mk(sw, sh), dg = drift.getContext('2d'), img = dg.createImageData(sw, sh), d = img.data;
  for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
    const i = y * sw + x;
    const hx = hgt[y * sw + Math.min(sw - 1, x + 1)] - hgt[y * sw + Math.max(0, x - 1)];
    const hy = hgt[Math.min(sh - 1, y + 1) * sw + x] - hgt[Math.max(0, y - 1) * sw + x];
    const light = clamp(-(hx * 0.55 + hy * 0.85) * 9, -1, 1); // 빛: 왼쪽 위
    const o = i * 4;
    if (light > 0) { d[o] = 255; d[o + 1] = 255; d[o + 2] = 255; d[o + 3] = light * 150; }
    else { d[o] = 112; d[o + 1] = 140; d[o + 2] = 188; d[o + 3] = -light * 95; }
  }
  dg.putImageData(img, 0, 0);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(drift, 0, 0, W, H);

  // 3) 큰 그늘 덩어리(부드러운 굴곡)
  const big = mk(48, 27), bgc = big.getContext('2d'), bimg = bgc.createImageData(48, 27);
  for (let y = 0; y < 27; y++) for (let x = 0; x < 48; x++) {
    const v = fbm(x / 48 * 2.5 + 40, y / 27 * 1.6 + 9, 3), o = (y * 48 + x) * 4;
    bimg.data[o] = 120; bimg.data[o + 1] = 150; bimg.data[o + 2] = 200; bimg.data[o + 3] = clamp((v - 0.5) * 2.4, 0, 1) * 55;
  }
  bgc.putImageData(bimg, 0, 0);
  g.drawImage(big, 0, 0, W, H);

  // 4) 가장자리 비네팅: 중앙 무대에 시선이 모이게
  const vg = g.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.hypot(W, H) * 0.62);
  vg.addColorStop(0, 'rgba(110,135,180,0)'); vg.addColorStop(1, 'rgba(96,122,170,0.32)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  // 5) 고운 입자(눈 알갱이)
  const tile = mk(192, 192), tg = tile.getContext('2d'), timg = tg.createImageData(192, 192);
  for (let i = 0; i < timg.data.length; i += 4) {
    const r = Math.random();
    if (r < 0.5) { timg.data[i] = timg.data[i + 1] = timg.data[i + 2] = 255; timg.data[i + 3] = r * 70; }
    else { timg.data[i] = 120; timg.data[i + 1] = 145; timg.data[i + 2] = 190; timg.data[i + 3] = (r - 0.5) * 40; }
  }
  tg.putImageData(timg, 0, 0);
  g.fillStyle = g.createPattern(tile, 'repeat'); g.fillRect(0, 0, W, H);

  // 반짝이: 아래(가까운 곳)일수록 많게
  glints = Array.from({ length: 260 }, () => ({
    x: Math.random() * W, y: Math.pow(Math.random(), 0.7) * H, ph: Math.random() * 6.28, sp: 0.5 + Math.random() * 1.8,
    big: Math.random() < 0.12, warm: Math.random() < 0.3,
  }));
}

function buildSnow() {
  const n = Math.round((W * H) / (1920 * 1080 * DPR * DPR) * 60) + 25;
  flakes = Array.from({ length: n }, () => newFlake(true));
}
function makeFlakeSprite() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 96;
  const g = canvas.getContext('2d');
  g.translate(48, 48);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const crystal = () => {
    for (let arm = 0; arm < 6; arm++) {
      g.save(); g.rotate(arm * Math.PI / 3);
      g.moveTo(0, 0); g.lineTo(0, -38);
      for (const y of [-18, -28]) {
        const length = y === -18 ? 10 : 7;
        g.moveTo(0, y); g.lineTo(-length, y - length * 0.75);
        g.moveTo(0, y); g.lineTo(length, y - length * 0.75);
      }
      g.restore();
    }
  };
  g.beginPath(); crystal();
  g.strokeStyle = 'rgba(85, 135, 190, .45)'; g.lineWidth = 5;
  g.shadowColor = 'rgba(75, 120, 175, .3)'; g.shadowBlur = 5; g.stroke();
  g.shadowBlur = 0; g.strokeStyle = '#fff'; g.lineWidth = 2.5; g.stroke();
  return canvas;
}
const flakeSprite = makeFlakeSprite();
function newFlake(anywhere) {
  const z = Math.random();
  return {
    x: Math.random() * W, y: anywhere ? Math.random() * H : -10 * DPR,
    r: (10 + z * 10) * DPR, vy: (25 + z * 70) * DPR, ph: Math.random() * 6.28, z,
    extra: false,
  };
}

/* ───────── 오디오 (첫 클릭/키 입력 또는 자동재생 허용 시) ───────── */
let actx = null, masterGain = null, windGain = null, snowGain = null, musicGain = null, noiseBuffer = null, muted = false, lastSwish = 0;
const music = new Audio('./assets/joy-to-the-world-piano.ogg');
music.loop = true;
function audioOn() {
  try {
    if (!actx) { actx = new AudioContext(); startWind(); }
    if (actx.state === 'suspended') actx.resume();
    if (music.paused) music.play().catch(() => {});
  } catch (e) { /* 오디오 없음 */ }
}
addEventListener('pointerdown', audioOn);
addEventListener('keydown', audioOn);

function startWind() {
  masterGain = actx.createGain(); masterGain.gain.value = 0;
  masterGain.connect(actx.destination);
  const len = actx.sampleRate * 3, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  noiseBuffer = buf;
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420; bp.Q.value = 0.6;
  windGain = actx.createGain(); windGain.gain.value = 0;
  src.connect(bp).connect(windGain).connect(masterGain);
  const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1300;
  snowGain = actx.createGain(); snowGain.gain.value = 0;
  src.connect(hp).connect(snowGain).connect(masterGain);
  musicGain = actx.createGain(); musicGain.gain.value = 0;
  actx.createMediaElementSource(music).connect(musicGain).connect(masterGain);
  src.start();
  setAudioLevels();
}
function setAudioLevels() {
  if (!actx || !masterGain || !windGain || !snowGain || !musicGain) return;
  const t = actx.currentTime;
  masterGain.gain.setTargetAtTime(muted ? 0 : 1, t, 0.1);
  windGain.gain.setTargetAtTime(0.018, t, 0.2);
  snowGain.gain.setTargetAtTime(state === 'cover' ? 0.035 : state === 'draw' ? 0.012 : 0, t, 0.25);
  musicGain.gain.setTargetAtTime(state === 'rise' ? 0.07 : 0.14, t, 0.5);
}
function chime() {
  if (muted || !actx || actx.state !== 'running') return;
  const notes = [783.99, 987.77, 1174.66, 1567.98, 1975.53];
  notes.forEach((f, i) => {
    const t = actx.currentTime + i * 0.13;
    for (const [type, mul, vol] of [['sine', 1, 0.12], ['triangle', 2, 0.03]]) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f * mul;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
      o.connect(g).connect(masterGain); o.start(t); o.stop(t + 3);
    }
  });
}
function swish() {
  if (now - lastSwish < 0.22 || muted || !actx || actx.state !== 'running' || !noiseBuffer) return;
  lastSwish = now;
  const t = actx.currentTime, src = actx.createBufferSource(), bp = actx.createBiquadFilter(), gain = actx.createGain();
  src.buffer = noiseBuffer;
  bp.type = 'bandpass'; bp.frequency.value = 850 + Math.random() * 350; bp.Q.value = 0.5;
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.085, t + 0.025);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.19);
  src.connect(bp).connect(gain).connect(masterGain);
  src.start(t, Math.random() * 2.5, 0.2); src.stop(t + 0.2);
}

/* ───────── 포즈 인식 ───────── */
let landmarker = null, status = '카메라와 포즈 인식을 준비하고 있어요…';
let cameras = [], camLabel = '', toast = '', toastT = 0;
let cameraRetryTimer = null, cameraBusy = false, lastCameraFrameAt = performance.now();
const CAM_KEY = 'snow-angel-camera';
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const cameraPermissionDenied = e => e?.name === 'NotAllowedError' || e?.name === 'PermissionDeniedError';
const cameraErrorMessage = e => cameraPermissionDenied(e)
  ? '크롬 주소창에서 카메라 권한을 허용한 뒤 새로고침해 주세요.'
  : e?.name === 'NotReadableError'
    ? '다른 탭이나 앱이 카메라를 사용 중이에요. 닫으면 자동 연결됩니다.'
  : '카메라를 연결해 주세요. 자동으로 다시 시도합니다.';

async function openCamera(deviceId) {
  const previous = video.srcObject;
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 1280 }, height: { ideal: 720 }, ...(deviceId ? { deviceId: { exact: deviceId } } : {}) },
    audio: false,
  });
  try { video.srcObject = stream; await video.play(); }
  catch (e) {
    stream.getTracks().forEach(t => t.stop());
    video.srcObject = previous;
    if (previous) video.play().catch(() => {});
    throw e;
  }
  const track = stream.getVideoTracks()[0];
  track.addEventListener('ended', () => {
    if (video.srcObject !== stream) return;
    status = '카메라 연결이 끊겼어요. 다시 연결 중…';
    scheduleCameraRetry();
  });
  if (previous) previous.getTracks().forEach(t => t.stop());
  if (cameraRetryTimer) { clearTimeout(cameraRetryTimer); cameraRetryTimer = null; }
  lastVideoTime = -1; lastCameraFrameAt = performance.now();
  camLabel = track.label || '카메라';
  return track.getSettings().deviceId;
}

function scheduleCameraRetry(delay = 3000) {
  if (DEMO || cameraRetryTimer) return;
  cameraRetryTimer = setTimeout(async () => {
    cameraRetryTimer = null;
    if (cameraBusy) { scheduleCameraRetry(); return; }
    cameraBusy = true;
    try {
      await chooseCamera();
      if (landmarker) status = '';
      showToast(`카메라 다시 연결됨: ${camLabel}`);
    } catch (e) {
      console.warn('카메라 재연결 실패', e);
      status = cameraErrorMessage(e);
      if (!cameraPermissionDenied(e)) scheduleCameraRetry();
    } finally { cameraBusy = false; }
  }, delay);
}

// 노트북 내장 카메라가 아니라 TV 위 외장 웹캠을 우선 사용
async function chooseCamera() {
  let current = await openCamera(store.get(CAM_KEY)).catch(() => openCamera());
  cameras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  if (!store.get(CAM_KEY) && cameras.length > 1) {
    const builtIn = /integrated|built-?in|facetime|내장|internal/i;
    const external = cameras.find(d => d.label && !builtIn.test(d.label));
    if (external && external.deviceId !== current) {
      try { current = await openCamera(external.deviceId); }
      catch (e) { console.warn('외장 카메라를 열 수 없어 현재 카메라를 사용합니다', e); }
    }
  }
  return current;
}

async function nextCamera() {
  if (cameraBusy) return;
  cameras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  if (cameras.length < 2) { showToast('연결된 카메라가 하나뿐이에요'); return; }
  const cur = video.srcObject?.getVideoTracks()[0]?.getSettings().deviceId;
  const next = cameras[(cameras.findIndex(d => d.deviceId === cur) + 1) % cameras.length];
  cameraBusy = true;
  try { await openCamera(next.deviceId); store.set(CAM_KEY, next.deviceId); showToast(`카메라: ${camLabel}`); status = ''; }
  catch (e) { console.error(e); showToast('이 카메라를 열 수 없어요'); }
  finally { cameraBusy = false; }
}
function showToast(s) { toast = s; toastT = 2.5; }

// R: 현장 리셋 — 진행 중인 장면, 자국, 인식된 사람 정보를 모두 지우고 첫 화면으로
function resetExhibit() {
  tracks.forEach((tr, i) => { tracks[i] = newTrack(); });
  go('idle');
  st = CFG.idleCooldown; // 리셋 직후 바로 다음 관객을 받을 수 있게
  if (video.srcObject?.getVideoTracks()[0]?.readyState !== 'live' && !DEMO) scheduleCameraRetry(200);
  showToast('처음 화면으로 돌아왔어요');
}

// 전시 중 노트북/TV 화면이 꺼지지 않게
let wakeLock = null;
async function keepAwake() {
  try { if (document.visibilityState === 'visible' && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } }
  catch (e) { /* 지원 안 함 */ }
}
document.addEventListener('visibilitychange', keepAwake);
if (navigator.mediaDevices) navigator.mediaDevices.addEventListener?.('devicechange', () => {
  if (video.srcObject?.getVideoTracks()[0]?.readyState !== 'live') scheduleCameraRetry(500);
});

// ?demo: 카메라 없이 가상의 두 사람이 팔다리를 젓는 화면으로 연출 확인
const DEMO_MODE = new URLSearchParams(location.search).get('demo');
const DEMO = DEMO_MODE !== null;
function demoPose(t, cx) {
  const lm = Array.from({ length: 33 }, () => ({ x: 0.5, y: 0.5, visibility: 0 }));
  const jump = DEMO_MODE === 'jump' ? 0.1 * Math.pow(Math.max(0, Math.sin(t * 2.8)), 3) : 0;
  const set = (i, x, y) => { lm[i] = { x: 1 - x, y: y - jump, visibility: 0.99 }; }; // 앱이 좌우 반전하므로 미리 뒤집음
  const k = 0.5 - 0.5 * Math.cos(t * 2.2), arm = (20 + k * 140) * Math.PI / 180, leg = (6 + k * 22) * Math.PI / 180;
  const hipY = 0.66, shY = 0.44, ar = 16 / 9;
  set(0, cx, 0.33); set(11, cx - 0.045, shY); set(12, cx + 0.045, shY); set(23, cx - 0.03, hipY); set(24, cx + 0.03, hipY);
  for (const [s, e, w, dir] of [[11, 13, 15, -1], [12, 14, 16, 1]]) {
    const sx = lm[s].x === undefined ? 0 : 1 - lm[s].x;
    const dx = Math.sin(arm) * dir / ar, dy = Math.cos(arm);
    set(e, sx + dx * 0.12, shY + dy * 0.12); set(w, sx + dx * 0.23, shY + dy * 0.23);
  }
  for (const [h, kn, an, dir] of [[23, 25, 27, -1], [24, 26, 28, 1]]) {
    const hx = 1 - lm[h].x, dx = Math.sin(leg) * dir / ar, dy = Math.cos(leg);
    set(kn, hx + dx * 0.14, hipY + dy * 0.14); set(an, hx + dx * 0.27, hipY + dy * 0.27);
  }
  return lm;
}

async function init() {
  keepAwake();
  if (DEMO) { status = ''; return; }
  try {
    await chooseCamera();
    showToast(`카메라: ${camLabel}`);
  } catch (e) {
    console.error(e); status = cameraErrorMessage(e);
    if (!cameraPermissionDenied(e)) scheduleCameraRetry();
  }
  try {
    const files = await FilesetResolver.forVisionTasks('./vendor/tasks-vision/wasm');
    const make = delegate => PoseLandmarker.createFromOptions(files, {
      baseOptions: { modelAssetPath: './models/pose_landmarker_lite.task', delegate },
      runningMode: 'VIDEO', numPoses: 2, outputSegmentationMasks: true,
      minPoseDetectionConfidence: 0.5, minPosePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
    });
    try { landmarker = await make('GPU'); } catch (e) { console.warn('GPU 실패, CPU로 전환', e); landmarker = await make('CPU'); }
    if (video.srcObject?.getVideoTracks()[0]?.readyState === 'live') status = '';
  } catch (e) {
    console.error(e); status = '포즈 인식 모델을 불러오지 못했어요.';
  }
  audioOn(); // 키오스크 자동재생 허용 시 바로 소리 시작
}

/* ───────── 사람 추적 (지정 위치 2곳: 왼쪽/오른쪽) ───────── */
const NAMES = { lSh: 11, rSh: 12, lEl: 13, rEl: 14, lWr: 15, rWr: 16, lHip: 23, rHip: 24, lKn: 25, rKn: 26, lAn: 27, rAn: 28 };
const tracks = [newTrack(), newTrack()];
function newTrack() {
  return { sm: null, lastSeen: -99, firstSeen: 0, anchorX: null, size: 0, k: 0, ax: 0, ay: 0, s: 0, pts: null, head: null,
    groundHipY: null, groundShY: null, jumpY: 0, jumpAt: 0,
    wMin: [999, 999], wMax: [-999, -999], legMax: 0, hasLegs: false, used: false, angelHead: null };
}
function resetProgress(tr) {
  tr.wMin = [999, 999]; tr.wMax = [-999, -999]; tr.legMax = 0; tr.hasLegs = false; tr.used = false; tr.angelHead = null;
}
const present = tr => now - tr.lastSeen < 0.4;

const vis = p => p.v ?? 1;
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function angleBetween(ax, ay, bx, by) {
  const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by);
  if (!la || !lb) return 0;
  return Math.acos(clamp((ax * bx + ay * by) / (la * lb), -1, 1)) * 180 / Math.PI;
}

function ingest(list, masks = []) {
  const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
  const items = list
    .map((lm, i) => Object.assign(lm, { mask: masks[i] }))
    .filter(lm => [11, 12].every(i => vis({ v: lm[i].visibility }) > 0.5))
    .map(lm => {
      const shX = (lm[11].x + lm[12].x) / 2, shY = (lm[11].y + lm[12].y) / 2;
      const hipX = (lm[23].x + lm[24].x) / 2, hipY = (lm[23].y + lm[24].y) / 2;
      const torso = Math.hypot(shX - hipX, shY - hipY), shoulder = Math.abs(lm[11].x - lm[12].x);
      return { lm, hx: 1 - shX, torso, shoulder, size: Math.max(torso, shoulder * 1.5) };
    })
    .filter(it => Number.isFinite(it.hx) && (it.torso >= CFG.minTorsoFrac || it.shoulder >= CFG.minShoulderFrac));
  const assign = [null, null];
  const used = new Set();
  const indexed = items.map((it, index) => ({ it, index }));
  const inZone = (it, slot) => slot === 0 ? it.hx > 0.08 && it.hx < 0.48 : it.hx > 0.52 && it.hx < 0.92;
  // 먼저 최근 참가자를 가까운 위치·비슷한 크기의 포즈와 연결한다.
  for (let slot = 0; slot < 2; slot++) {
    const tr = tracks[slot];
    if (now - tr.lastSeen > CFG.slotHold || tr.anchorX === null) continue;
    const match = indexed.filter(({ it, index }) => !used.has(index) && inZone(it, slot)
      && Math.abs(it.hx - tr.anchorX) < 0.14
      && it.size / tr.size > 0.55 && it.size / tr.size < 1.8)
      .sort((a, b) => Math.abs(a.it.hx - tr.anchorX) - Math.abs(b.it.hx - tr.anchorX))[0];
    if (match) { assign[slot] = match.it; used.add(match.index); }
  }
  // 잠깐 안 보이는 자리는 예약하고, 빈 자리에는 해당 구역의 한 명만 새로 받는다.
  for (let slot = 0; slot < 2; slot++) {
    if (assign[slot] || now - tracks[slot].lastSeen <= CFG.slotHold) continue;
    const match = indexed.filter(({ it, index }) => !used.has(index) && inZone(it, slot))
      .sort((a, b) => Math.abs(a.it.hx - (slot ? 0.75 : 0.25)) - Math.abs(b.it.hx - (slot ? 0.75 : 0.25)))[0];
    if (match) { assign[slot] = match.it; used.add(match.index); }
  }
  assign.forEach((it, i) => {
    if (!it) return;
    tracks[i].anchorX = it.hx; tracks[i].size = it.size;
    updateTrack(tracks[i], it.lm, vw, vh);
  });
}

function updateTrack(tr, lm, vw, vh) {
  const raw = lm.map(p => ({ x: (1 - p.x) * vw, y: p.y * vh, v: p.visibility ?? 1 }));
  const fresh = !present(tr) || !tr.sm;
  if (fresh) { tr.sm = raw.map(p => ({ ...p })); tr.firstSeen = now; tr.lastTips = null; tr.lastStampY = null; tr.lastSprayJumpY = 0; tr.groundHipY = null; tr.groundShY = null; tr.jumpY = 0; }
  else tr.sm.forEach((p, i) => { const r = raw[i]; p.x += (r.x - p.x) * 0.6; p.y += (r.y - p.y) * 0.6; p.v += (r.v - p.v) * 0.5; });
  tr.lastSeen = now;
  tr.poseVersion = (tr.poseVersion || 0) + 1;

  const S = tr.sm;
  const hip = mid(S[23], S[24]), sh = mid(S[11], S[12]);
  const torso = Math.max(Math.hypot(sh.x - hip.x, sh.y - hip.y), vh * 0.08);
  // 몸통은 각자의 눈밭 중앙에 두고, 팔다리가 화면 밖으로 커지지 않게 크기를 제한한다.
  const visible = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28]
    .map(i => S[i]).filter(p => p.v > 0.35 && Number.isFinite(p.x) && Number.isFinite(p.y));
  const maxDx = Math.max(1, ...visible.map(p => Math.abs(p.x - hip.x)));
  const maxDy = Math.max(1, ...visible.map(p => Math.abs(p.y - hip.y)));
  const targetK = Math.min(H * CFG.figure / torso, W * 0.16 / maxDx, H * 0.29 / maxDy);
  tr.k = fresh ? targetK : tr.k + (targetK - tr.k) * 0.25;
  tr.s = torso * tr.k;
  tr.ax = W * (tracks.indexOf(tr) === 0 ? 0.28 : 0.72);
  if (tr.groundHipY === null) { tr.groundHipY = hip.y; tr.groundShY = sh.y; }
  const rise = Math.min(tr.groundHipY - hip.y, tr.groundShY - sh.y);
  if (rise < torso * 0.06) {
    tr.groundHipY += (hip.y - tr.groundHipY) * 0.12;
    tr.groundShY += (sh.y - tr.groundShY) * 0.12;
    tr.jumpAt = 0;
  } else {
    if (!tr.jumpAt) tr.jumpAt = now;
    if (now - tr.jumpAt > 1.2) {
      tr.groundHipY += (hip.y - tr.groundHipY) * 0.06;
      tr.groundShY += (sh.y - tr.groundShY) * 0.06;
    }
  }
  const jumpTarget = clamp((rise - torso * 0.05) * tr.k * 1.2, 0, H * 0.13);
  tr.jumpY += (jumpTarget - tr.jumpY) * 0.45;
  tr.ay = H * 0.59 - tr.jumpY;

  if (lm.mask) { try { updateCutout(tr, lm.mask, vw, vh); } catch (e) { console.warn(e); tr.hasCut = false; } }
  else tr.hasCut = false;

  const P = {};
  for (const [n, i] of Object.entries(NAMES)) P[n] = { x: tr.ax + (S[i].x - hip.x) * tr.k, y: tr.ay + (S[i].y - hip.y) * tr.k, v: S[i].v };
  P.shM = mid(P.lSh, P.rSh); P.hipM = mid(P.lHip, P.rHip);
  const ux = P.shM.x - P.hipM.x, uy = P.shM.y - P.hipM.y, ul = Math.hypot(ux, uy) || 1;
  P.head = { x: P.shM.x + ux / ul * tr.s * 0.5, y: P.shM.y + uy / ul * tr.s * 0.5 };
  tr.pts = P;

  if (state !== 'draw') return;
  // 진행도: 팔을 휘저은 각도 범위 + 다리를 벌린 정도
  const dx = hip.x - sh.x, dy = hip.y - sh.y;
  [[11, 15], [12, 16]].forEach(([s, w], side) => {
    if (S[w].v < 0.5) return;
    const ang = angleBetween(S[w].x - S[s].x, S[w].y - S[s].y, dx, dy);
    tr.wMin[side] = Math.min(tr.wMin[side], ang); tr.wMax[side] = Math.max(tr.wMax[side], ang);
  });
  const [la, ra] = S[27].v > 0.5 && S[28].v > 0.5 ? [27, 28] : S[25].v > 0.5 && S[26].v > 0.5 ? [25, 26] : [];
  if (la) {
    tr.hasLegs = true;
    tr.legMax = Math.max(tr.legMax, angleBetween(S[la].x - S[23].x, S[la].y - S[23].y, S[ra].x - S[24].x, S[ra].y - S[24].y));
  }
  tr.used = true;
}

/* ───────── 사람 누끼: 배경을 지우고 하단 미리보기에 표시 ───────── */
const CUT = 0.4; // 누끼 해상도(카메라 대비) — 하단 카드(240×300)에 충분한 크기
function updateCutout(tr, mask, vw, vh) {
  const cw = Math.round(vw * CUT), ch = Math.round(vh * CUT);
  if (!tr.cut || tr.cut.width !== cw || tr.cut.height !== ch) {
    tr.cut = mk(cw, ch); tr.mcv = mk(cw, ch);
    tr.mimg = tr.mcv.getContext('2d').createImageData(cw, ch);
    tr.mimg.data.fill(255);
  }
  const mw = mask.width, mh = mask.height, f = mask.getAsFloat32Array(), d = tr.mimg.data;
  for (let y = 0; y < ch; y++) {
    const row = ((y / ch * mh) | 0) * mw;
    for (let x = 0; x < cw; x++) {
      const v = f[row + (mw - 1 - ((x / cw * mw) | 0))]; // 좌우 반전(거울)
      d[(y * cw + x) * 4 + 3] = v < 0.3 ? 0 : v > 0.7 ? 255 : (v - 0.3) * 637.5;
    }
  }
  tr.mcv.getContext('2d').putImageData(tr.mimg, 0, 0);
  const c = tr.cut.getContext('2d');
  c.globalCompositeOperation = 'source-over'; c.clearRect(0, 0, cw, ch);
  c.save(); c.translate(cw, 0); c.scale(-1, 1); c.drawImage(video, 0, 0, cw, ch); c.restore();
  c.globalCompositeOperation = 'destination-in'; c.drawImage(tr.mcv, 0, 0);
  c.globalCompositeOperation = 'source-over';
  tr.hasCut = true;
}

function drawPersonCards() {
  for (let i = 0; i < tracks.length; i++) {
    const tr = tracks[i], card = personCards[i], g = card.ctx;
    const hasVideo = video.readyState >= 2 && video.videoWidth && video.videoHeight && video.srcObject?.getVideoTracks()[0]?.readyState === 'live';
    const active = hasVideo && present(tr) && tr.sm;
    card.el.dataset.active = String(!!active);
    const progress = Math.round(clamp(trackProgress(tr) / CFG.completeProgress, 0, 1) * 100);
    const showingProgress = active && state === 'draw';
    card.status.textContent = !hasVideo ? '카메라 연결 중' : !active ? '자리에 서 주세요' : state === 'draw' ? progress >= 100 ? '천사 거의 완성!' : '천사 만드는 중' : state === 'rise' ? '천사 완성!' : '사람 인식됨';
    card.percent.textContent = showingProgress ? `${progress}%` : '';
    card.bar.style.width = showingProgress ? `${progress}%` : '0%';
    g.clearRect(0, 0, card.canvas.width, card.canvas.height);
    if (!hasVideo) continue;

    // 각 자리의 카메라 절반을 고정해서 관절 추적 오차가 화면 줌으로 이어지지 않게 한다.
    const ratio = card.canvas.width / card.canvas.height;
    const w = Math.min(video.videoWidth / 2, video.videoHeight * ratio), h = w / ratio;
    const x = i * video.videoWidth / 2 + (video.videoWidth / 2 - w) / 2;
    const y = (video.videoHeight - h) / 2;
    // 인식 전에도 카메라 화면을 보여줘 관객이 서야 할 위치를 확인할 수 있게 한다.
    g.save(); g.globalAlpha = active ? 0.55 : 0.9;
    g.translate(card.canvas.width, 0); g.scale(-1, 1);
    g.drawImage(video, video.videoWidth - x - w, y, w, h, 0, 0, card.canvas.width, card.canvas.height);
    g.restore();
    if (!active) continue;
    if (tr.hasCut) {
      g.drawImage(tr.cut, x * CUT, y * CUT, w * CUT, h * CUT, 0, 0, card.canvas.width, card.canvas.height);
    } else {
      const dot = p => ({ x: (p.x - x) / w * card.canvas.width, y: (p.y - y) / h * card.canvas.height });
      g.strokeStyle = '#f6fdff'; g.lineWidth = 4; g.lineCap = 'round';
      for (const [a, b] of [[11, 12], [11, 13], [13, 15], [12, 14], [14, 16], [11, 23], [12, 24], [23, 24], [23, 25], [25, 27], [24, 26], [26, 28]]) {
        if (tr.sm[a].v < 0.35 || tr.sm[b].v < 0.35) continue;
        const p = dot(tr.sm[a]), q = dot(tr.sm[b]);
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
      }
    }
  }
}

function trackProgress(tr) {
  if (!tr.used) return 0;
  const wing = [0, 1].reduce((s, i) => s + (tr.wMax[i] > tr.wMin[i] ? clamp((tr.wMax[i] - tr.wMin[i]) / 70, 0, 1) : 0), 0) / 2;
  const leg = tr.hasLegs ? clamp((tr.legMax - 10) / 20, 0, 1) : 0;
  return clamp(wing + leg * 0.15, 0, 1);
}

/* ───────── 눈 위 자국 ───────── */
function limb(c, pts, width) {
  c.lineWidth = width;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (vis(a) < 0.35 || vis(b) < 0.35) break;
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
  }
}
function bodyShape(c, P, s, col) {
  c.save(); c.scale(IMP, IMP);
  c.strokeStyle = c.fillStyle = col; c.lineCap = c.lineJoin = 'round';
  limb(c, [P.lSh, P.lEl, P.lWr], s * 0.24); limb(c, [P.rSh, P.rEl, P.rWr], s * 0.24);
  limb(c, [P.lHip, P.lKn, P.lAn], s * 0.3); limb(c, [P.rHip, P.rKn, P.rAn], s * 0.3);
  c.lineWidth = s * 0.3;
  c.beginPath(); c.moveTo(P.lSh.x, P.lSh.y); c.lineTo(P.rSh.x, P.rSh.y); c.lineTo(P.rHip.x, P.rHip.y); c.lineTo(P.lHip.x, P.lHip.y); c.closePath();
  c.fill(); c.stroke();
  c.lineWidth = s * 0.2; c.beginPath(); c.moveTo(P.shM.x, P.shM.y); c.lineTo(P.head.x, P.head.y); c.stroke();
  c.beginPath(); c.arc(P.head.x, P.head.y, s * 0.3, 0, Math.PI * 2); c.fill();
  c.restore();
}
let imprintDirty = true;
let sparkles = [];
function addSparkles(x, y, count, spread) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, speed = (22 + Math.random() * 55) * DPR;
    sparkles.push({ x: x + (Math.random() - 0.5) * spread, y: y + (Math.random() - 0.5) * spread,
      vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - 18 * DPR,
      age: 0, life: 0.4 + Math.random() * 0.45, r: (2 + Math.random() * 2) * DPR, star: Math.random() < 0.55 });
  }
  if (sparkles.length > 110) sparkles.splice(0, sparkles.length - 110);
}
function addSnowSweep(x, y) {
  for (let i = 0; i < 3; i++) {
    sparkles.push({ x: x + (Math.random() - 0.5) * 24 * DPR, y,
      vx: (Math.random() - 0.5) * 80 * DPR, vy: -(80 + Math.random() * 100) * DPR,
      age: 0, life: 0.35 + Math.random() * 0.35, r: (1.5 + Math.random() * 2) * DPR, snow: true });
  }
  if (sparkles.length > 110) sparkles.splice(0, sparkles.length - 110);
}
function stamp(tr) {
  const mask = dent.getContext('2d'), hipY = tr.pts.hipM.y;
  if (tr.lastStampY !== null && tr.lastStampY - hipY > tr.s * 0.08) {
    mask.save(); mask.translate(0, (tr.lastStampY - hipY) * IMP * 0.5);
    bodyShape(mask, tr.pts, tr.s, '#ffffff'); mask.restore();
  }
  if (tr.jumpY < tr.s * 0.04) tr.lastSprayJumpY = 0;
  if (tr.jumpY - (tr.lastSprayJumpY || 0) > tr.s * 0.06 && now - (tr.lastJumpSpray || 0) > 0.12) {
    for (const n of ['lWr', 'rWr', 'lAn', 'rAn']) {
      const p = tr.pts[n]; if (vis(p) > 0.5) addSnowSweep(p.x, p.y);
    }
    tr.lastSprayJumpY = tr.jumpY; tr.lastJumpSpray = now;
  }
  bodyShape(mask, tr.pts, tr.s, '#ffffff'); // dent = 눌린 모양 마스크
  tr.lastStampY = hipY;
  tr.angelHead = { ...tr.pts.head };
  imprintDirty = true;
  const tips = ['lWr', 'rWr', 'lAn', 'rAn'];
  if (tr.lastTips && now - (tr.sparkAt || 0) > 0.08) {
    let moved = false;
    for (const n of tips) {
      const p = tr.pts[n], prev = tr.lastTips[n];
      if (vis(p) < 0.5 || !prev || Math.hypot(p.x - prev.x, p.y - prev.y) < tr.s * 0.035) continue;
      addSparkles(p.x, p.y, 2, tr.s * 0.08);
      moved = true;
    }
    if (moved) { tr.sparkAt = now; swish(); }
  }
  tr.lastTips = Object.fromEntries(tips.map(n => [n, { ...tr.pts[n] }]));
}

function clearImprint() {
  for (const c of [dent, shade, tmpA]) c.getContext('2d').clearRect(0, 0, c.width, c.height);
  imprintDirty = true;
}

// 마스크로 눈에 눌린 자국을 입체적으로 합성: 바깥 둔덕 하이라이트 + 바닥 그늘 + 위쪽 안벽 그림자
let lastCompose = -1;
function composeImprint() {
  if (!imprintDirty) return;
  // 블러 합성은 무거우므로 몸짓 중에는 초당 약 8번만 다시 그린다(자국은 마스크에 계속 쌓임)
  if (state === 'draw' && now - lastCompose < 0.12) return;
  lastCompose = now;
  imprintDirty = false;
  const w = dent.width, h = dent.height, u = DPR * IMP * Math.min(W / DPR / 1920, H / DPR / 1080) * 1.6 + 0.5;
  const out = shade.getContext('2d'), t = tmpA.getContext('2d');
  out.clearRect(0, 0, w, h);
  const layer = (color, blur, dx, dy, cutMask, alpha = 1) => {
    t.globalCompositeOperation = 'source-over'; t.clearRect(0, 0, w, h);
    t.filter = blur ? `blur(${blur}px)` : 'none'; t.drawImage(dent, dx, dy); t.filter = 'none';
    t.globalCompositeOperation = 'source-in'; t.fillStyle = color; t.fillRect(0, 0, w, h);
    if (cutMask) { t.globalCompositeOperation = cutMask; t.drawImage(dent, 0, 0); }
    t.globalCompositeOperation = 'source-over';
    out.globalAlpha = alpha; out.drawImage(tmpA, 0, 0); out.globalAlpha = 1;
  };
  // 밀려 올라온 눈 둔덕(바깥 가장자리, 위쪽이 더 밝음)
  layer('#ffffff', 10 * u, 0, -3 * u, 'destination-out', 1);
  layer('#ffffff', 4 * u, 0, -1 * u, 'destination-out', 0.9);
  // 둔덕 아래쪽 바깥 그늘
  layer('#7f97c0', 6 * u, 0, 5 * u, 'destination-out', 0.3);
  // 눌린 바닥: 차가운 푸른 그늘(가장자리는 살짝 부드럽게)
  layer('#c2d2ea', 1.2 * u, 0, 0, null, 0.8);
  // 안벽 그림자: 마스크를 아래로 밀어 위쪽 안쪽 가장자리만 남김
  t.globalCompositeOperation = 'source-over'; t.clearRect(0, 0, w, h);
  t.fillStyle = '#5f78a6'; t.fillRect(0, 0, w, h);
  t.globalCompositeOperation = 'destination-out'; t.filter = `blur(${6 * u}px)`; t.drawImage(dent, 2 * u, 9 * u); t.filter = 'none';
  t.globalCompositeOperation = 'destination-in'; t.filter = `blur(${0.8 * u}px)`; t.drawImage(dent, 0, 0); t.filter = 'none';
  t.globalCompositeOperation = 'source-over';
  out.globalAlpha = 0.85; out.drawImage(tmpA, 0, 0); out.globalAlpha = 1;
  // 아래쪽 안벽에 비치는 빛
  t.clearRect(0, 0, w, h);
  t.fillStyle = '#ffffff'; t.fillRect(0, 0, w, h);
  t.globalCompositeOperation = 'destination-out'; t.filter = `blur(${4 * u}px)`; t.drawImage(dent, 0, -5 * u); t.filter = 'none';
  t.globalCompositeOperation = 'destination-in'; t.drawImage(dent, 0, 0);
  t.globalCompositeOperation = 'source-over';
  out.globalAlpha = 0.55; out.drawImage(tmpA, 0, 0); out.globalAlpha = 1;
}

/* ───────── 눈 자국이 떠오르는 장면 ───────── */
let angel = null;
function buildAngel() {
  const w = dent.width, h = dent.height;
  const tint = mk(w, h), t = tint.getContext('2d');
  t.drawImage(dent, 0, 0);
  t.globalCompositeOperation = 'source-in';
  const tg = t.createLinearGradient(0, 0, 0, h);
  tg.addColorStop(0, '#ffe5ac'); tg.addColorStop(0.55, '#f6ca76'); tg.addColorStop(1, '#dfa353');
  t.fillStyle = tg; t.fillRect(0, 0, w, h);
  const sprite = mk(w, h), g = sprite.getContext('2d');
  g.shadowColor = 'rgba(159,103,43,0.42)';
  g.globalAlpha = 0.55; g.shadowBlur = 12 * IMP * DPR; g.drawImage(tint, 0, 0);
  g.shadowBlur = 0; g.globalAlpha = 0.95; g.drawImage(tint, 0, 0);
  g.globalAlpha = 1;
  for (const tr of tracks) {
    if (!tr.angelHead) continue;
    const s = tr.s * IMP, x = tr.angelHead.x * IMP, y = tr.angelHead.y * IMP - s * 0.55;
    g.strokeStyle = '#a96b2e'; g.lineWidth = Math.max(3, s * 0.05);
    g.shadowColor = 'rgba(255,224,166,0.85)'; g.shadowBlur = 12 * IMP * DPR;
    g.beginPath(); g.ellipse(x, y, s * 0.38, s * 0.1, 0, 0, Math.PI * 2); g.stroke();
    const faceY = tr.angelHead.y * IMP;
    g.shadowBlur = 0; g.strokeStyle = 'rgba(104,67,39,0.8)';
    g.lineWidth = Math.max(1.5, s * 0.014); g.lineCap = 'round';
    for (const side of [-1, 1]) {
      const eyeX = x + side * s * 0.105;
      g.beginPath(); g.moveTo(eyeX - s * 0.04, faceY - s * 0.025);
      g.quadraticCurveTo(eyeX, faceY + s * 0.008, eyeX + s * 0.04, faceY - s * 0.025); g.stroke();
    }
    g.beginPath(); g.moveTo(x - s * 0.075, faceY + s * 0.095);
    g.quadraticCurveTo(x, faceY + s * 0.17, x + s * 0.075, faceY + s * 0.095); g.stroke();
  }
  angel = { sprite };
}

/* ───────── 상태 흐름: 눈 → 몸짓 → 비상 → 덮임 ───────── */
let state = 'idle', st = 0, doneT = 0, absentT = 0, now = 0;
function go(s) {
  state = s; st = 0;
  if (s === 'draw') { tracks.forEach(tr => { resetProgress(tr); tr.lastTips = null; tr.lastStampY = null; tr.lastSprayJumpY = 0; tr.stampedVersion = 0; }); doneT = 0; absentT = 0; clearImprint(); }
  if (s === 'rise') {
    buildAngel(); chime();
    for (const tr of tracks) if (tr.angelHead) {
      for (const n of ['head', 'lWr', 'rWr', 'lAn', 'rAn']) {
        const p = tr.pts?.[n]; if (p && vis(p) > 0.5) addSparkles(p.x, p.y, 5, tr.s * 0.35);
      }
    }
  }
  if (s === 'cover') {
    const extraCount = Math.round(flakes.filter(f => !f.extra).length * 0.35);
    for (let i = 0; i < extraCount; i++) flakes.push({ ...newFlake(false), y: -Math.random() * H * 0.15, extra: true });
  }
  if (s === 'idle') { clearImprint(); angel = null; sparkles = []; flakes = flakes.filter(f => !f.extra); }
  setAudioLevels();
}
function sessionProgress() {
  const participants = tracks.filter(tr => present(tr) && tr.used);
  return participants.length ? Math.max(...participants.map(trackProgress)) : 0;
}

function updateState(dt) {
  st += dt;
  const live = tracks.filter(present);
  if (state === 'idle') {
    if (st > CFG.idleCooldown && live.some(tr => now - tr.firstSeen > CFG.enterHold)) go('draw');
  } else if (state === 'draw') {
    live.forEach(tr => { if (tr.poseVersion !== tr.stampedVersion) { stamp(tr); tr.stampedVersion = tr.poseVersion; } });
    const p = sessionProgress();
    doneT = st >= CFG.drawMin && live.some(tr => trackProgress(tr) >= CFG.completeProgress) ? doneT + dt : 0;
    absentT = live.length ? 0 : absentT + dt;
    if (doneT > CFG.doneHold) go('rise');
    else if (st > CFG.drawMax) go(tracks.some(tr => tr.angelHead) ? 'rise' : 'cover');
    else if (st >= CFG.drawMin && absentT > CFG.absentLimit) go(tracks.some(tr => tr.angelHead) ? 'rise' : 'cover');
  } else if (state === 'rise') {
    if (st > CFG.rise) go('cover');
  } else if (state === 'cover') {
    if (st > CFG.cover) go('idle');
  }
}

/* ───────── 그리기 ───────── */
const ease = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
let glow = null;
function glowSprite() {
  if (glow) return glow;
  glow = mk(128, 128); const g = glow.getContext('2d');
  const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  // 흰 눈 위에서 보이도록 따뜻한 금빛
  rg.addColorStop(0, 'rgba(255,248,225,0.95)'); rg.addColorStop(0.25, 'rgba(255,210,130,0.5)'); rg.addColorStop(1, 'rgba(255,190,110,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  return glow;
}

function render(dt) {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(bg, 0, 0);

  // 눈 결 반짝임
  ctx.globalCompositeOperation = 'lighter';
  for (const g of glints) {
    const a = Math.pow(Math.max(0, Math.sin(now * g.sp + g.ph)), 14);
    if (a < 0.02) continue;
    const col = g.warm ? '255,236,200' : '225,240,255';
    ctx.fillStyle = `rgba(${col},${a * 0.9})`;
    ctx.beginPath(); ctx.arc(g.x, g.y, (g.big ? 1.6 : 1) * DPR, 0, Math.PI * 2); ctx.fill();
    if (g.big) {
      const r = 7 * DPR * a;
      ctx.strokeStyle = `rgba(${col},${a * 0.7})`; ctx.lineWidth = 0.8 * DPR;
      ctx.beginPath(); ctx.moveTo(g.x - r, g.y); ctx.lineTo(g.x + r, g.y); ctx.moveTo(g.x, g.y - r * 0.7); ctx.lineTo(g.x, g.y + r * 0.7); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  // 자국
  const impAlpha = state === 'cover' ? 0.65 * (1 - ease(clamp(st / CFG.cover, 0, 1)))
    : state === 'rise' ? 1 - 0.35 * ease(clamp(st / CFG.rise, 0, 1)) : 1;
  if (impAlpha > 0.01) {
    composeImprint();
    ctx.globalAlpha = impAlpha; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(shade, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // 감지된 사람은 아래쪽 개별 카드에 표시
  drawPersonCards();

  // 비상
  if (state === 'rise' && angel) {
    const p = clamp(st / CFG.rise, 0, 1), e = ease(p);
    const dy = -e * H * 0.16, sc = 1 + e * 0.015;
    const a = p < 0.18 ? p / 0.18 : p > 0.7 ? (1 - p) / 0.3 : 1;
    ctx.save(); ctx.globalAlpha = 0.92 * a;
    ctx.translate(W / 2, H / 2 + dy); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(angel.sprite, 0, 0, W, H);
    ctx.restore();
  }

  // 손발의 눈가루와 완성 순간의 작은 별빛
  for (const p of sparkles) {
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 34 * DPR * dt;
    const a = Math.max(0, 1 - p.age / p.life), r = p.r * (0.6 + a * 0.4);
    if (!a) continue;
    ctx.strokeStyle = p.snow ? `rgba(97,147,185,${a * 0.75})` : `rgba(177,119,57,${a * 0.8})`;
    ctx.fillStyle = p.snow ? `rgba(222,245,255,${a * 0.9})` : `rgba(255,226,160,${a * 0.9})`;
    if (p.star) {
      ctx.lineWidth = DPR; ctx.beginPath();
      ctx.moveTo(p.x - r * 2, p.y); ctx.lineTo(p.x + r * 2, p.y);
      ctx.moveTo(p.x, p.y - r * 2); ctx.lineTo(p.x, p.y + r * 2); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.65, 0, Math.PI * 2); ctx.fill();
  }
  if (sparkles.length) sparkles = sparkles.filter(p => p.age < p.life);

  // 손·발 빛 (몸짓이 잘 잡히고 있다는 피드백)
  if (state === 'idle' || state === 'draw') {
    const gs = glowSprite();
    for (const tr of tracks) {
      if (!present(tr) || !tr.pts) continue;
      for (const n of ['lWr', 'rWr', 'lAn', 'rAn']) {
        const p = tr.pts[n]; if (vis(p) < 0.5) continue;
        const r = tr.s * 0.22;
        ctx.drawImage(gs, p.x - r, p.y - r, r * 2, r * 2);
      }
    }
  }

  // 눈송이
  const boost = state === 'cover' ? 1.8 : 1;
  for (const f of flakes) {
    f.y += f.vy * dt * boost; f.x += Math.sin(now * (0.4 + f.z) + f.ph) * 12 * DPR * dt;
    if (f.y > H + 10 * DPR) {
      if (f.extra) { f.dead = true; continue; }
      Object.assign(f, newFlake(false));
    }
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.rotate(f.ph + now * (0.08 + f.z * 0.12));
    ctx.globalAlpha = 0.7 + f.z * 0.3;
    ctx.drawImage(flakeSprite, -f.r, -f.r, f.r * 2, f.r * 2);
    ctx.restore();
  }
  if (flakes.some(f => f.dead)) flakes = flakes.filter(f => !f.dead);

  drawText();
  if (debug) drawDebug();
  if (toastT > 0) {
    toastT -= dt;
    const u = Math.min(W / DPR / 1920, H / DPR / 1080);
    text(toast, W / 2, H * 0.94, 22 * u, 500, clamp(toastT, 0, 1));
  }
}

function text(str, x, y, size, weight = 500, alpha = 1, spacing = 0) {
  ctx.font = `${weight} ${size * DPR}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if ('letterSpacing' in ctx) ctx.letterSpacing = `${spacing * DPR}px`;
  ctx.shadowColor = `rgba(255,255,255,${0.65 * alpha})`; ctx.shadowBlur = 6 * DPR;
  ctx.fillStyle = `rgba(28,48,84,${alpha})`;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
}

function drawText() {
  const u = Math.min(W / DPR / 1920, H / DPR / 1080) * 1.0;
  const cx = W / 2;
  if (status) { text(status, cx, H / 2, 34 * u, 500); return; }
  if (state === 'idle' || state === 'draw') {
    const veil = ctx.createLinearGradient(0, 0, 0, H * 0.22);
    veil.addColorStop(0, 'rgba(246,250,255,0.84)');
    veil.addColorStop(0.65, 'rgba(246,250,255,0.45)');
    veil.addColorStop(1, 'rgba(246,250,255,0)');
    ctx.fillStyle = veil; ctx.fillRect(0, 0, W, H * 0.22);
  }
  if (state === 'idle') {
    const a = clamp(st / 1.2, 0, 1);
    text('CHRISTMAS SEASON  /  SNOW ANGEL', cx, H * 0.037, 17 * u, 600, 0.7 * a, 4 * u);
    text('스노우 엔젤', cx, H * 0.09, 58 * u, 700, a);
    text('왼쪽 또는 오른쪽 자리에 서서 팔을 크게 움직여 보세요', cx, H * 0.15, 27 * u, 500, 0.9 * a);
  } else if (state === 'draw') {
    const p = sessionProgress();
    text(p < 0.5 ? '움직일 때마다 눈 위에 자국이 남아요' : '좋아요, 눈 위에 천사가 그려지고 있어요', cx, H * 0.07, 33 * u, 700);
    text('팔과 다리를 휘저어 보세요', cx, H * 0.123, 23 * u, 500);
    const bw = W * 0.22, bh = 4 * DPR * u, by = H * 0.17;
    ctx.fillStyle = 'rgba(40,64,110,0.15)'; ctx.fillRect(cx - bw / 2, by, bw, bh);
    ctx.fillStyle = '#6c9dc2'; ctx.fillRect(cx - bw / 2, by, bw * clamp(p / CFG.completeProgress, 0, 1), bh);
  } else if (state === 'rise') {
    const p = st / CFG.rise, a = p < 0.2 ? p / 0.2 : p > 0.8 ? (1 - p) / 0.2 : 1;
    text('Merry Christmas', cx, H * 0.06, 52 * u, 700, a, 2 * u);
    text('당신의 천사가 하늘로 날아올라요', cx, H * 0.115, 24 * u, 500, a);
  }
}

/* ───────── 운영자용: D 디버그, F 전체화면, R 초기화, M 소리, ESC×2 종료 ───────── */
let debug = false, fps = 60;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'd') debug = !debug;
  if (k === 'f') (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  if (k === 'r' && !e.repeat) resetExhibit();
  if (k === 'c') nextCamera();
  if (k === 'm') { muted = !muted; setAudioLevels(); showToast(muted ? '소리 꺼짐' : '소리 켜짐'); }
  // ESC 두 번: 전시 끄기 (관객이 실수로 한 번 눌러도 꺼지지 않게)
  if (e.key === 'Escape' && !e.repeat) {
    if (now - escAt < 2.5) closeExhibit();
    else { escAt = now; showToast('ESC를 한 번 더 누르면 전시가 꺼져요'); }
  }
});
let escAt = -99;
async function closeExhibit() {
  showToast('전시를 종료합니다');
  // '전시 시작.exe'로 켠 경우: 런처에게 종료 요청(크롬+서버 정리). 그 외에는 창만 닫기 시도
  try { await fetch('./__shutdown', { method: 'POST' }); } catch (e) { /* 런처 없음 */ }
  setTimeout(() => window.close(), 400);
}
function drawDebug() {
  const w = 320 * DPR, h = video.videoHeight ? w * video.videoHeight / video.videoWidth : w * 9 / 16, x = W - w - 16 * DPR, y = 80 * DPR;
  if (video.readyState >= 2) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0, w, h); ctx.restore(); }
  for (const tr of tracks) if (present(tr) && tr.pts) {
    ctx.fillStyle = '#ff5a7a';
    for (const n of Object.keys(NAMES)) { const p = tr.pts[n]; ctx.beginPath(); ctx.arc(p.x, p.y, 4 * DPR, 0, 7); ctx.fill(); }
  }
  ctx.font = `${13 * DPR}px monospace`; ctx.textAlign = 'left'; ctx.fillStyle = '#123';
  const info = [`camera ${camLabel}`, `state ${state} ${st.toFixed(1)}s  fps ${fps.toFixed(0)}`,
    ...tracks.map((t, i) => `P${i + 1} ${present(t) ? 'on ' : 'off'} cutout ${t.hasCut ? 'ok' : 'NO'} progress ${(trackProgress(t) * 100).toFixed(0)}%`)];
  info.forEach((s, i) => ctx.fillText(s, x, y - 10 * DPR - (info.length - 1 - i) * 16 * DPR));
}

/* ───────── 루프 ───────── */
let last = performance.now(), lastVideoTime = -1;
function frame(ts) {
  const dt = Math.min(0.1, Math.max(0, (ts - last) / 1000)); last = ts; now += dt;
  if (dt > 0) fps += (1 / dt - fps) * 0.05;
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    lastCameraFrameAt = ts;
    // 콜백 안에서 처리해야 마스크 데이터가 유효함
    try { landmarker.detectForVideo(video, ts, res => ingest(res.landmarks || [], res.segmentationMasks || [])); }
    catch (e) { console.error(e); }
  }
  if (!DEMO && landmarker && video.srcObject && ts - lastCameraFrameAt > 4000) {
    lastCameraFrameAt = ts;
    status = '카메라 화면이 멈췄어요. 다시 연결 중…';
    scheduleCameraRetry();
  }
  if (DEMO) ingest(DEMO_MODE === 'solo' || DEMO_MODE === 'jump'
    ? [demoPose(now, 0.33)] : [demoPose(now, 0.33), demoPose(now + 0.7, 0.67)]);
  updateState(dt);
  render(dt);
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
init();
</script>
</body>
</html>
